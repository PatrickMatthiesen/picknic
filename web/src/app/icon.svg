<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Pattern for the gingham cloth -->
    <pattern id="gingham" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <rect width="16" height="16" fill="#D32F2F" />
      <rect width="8" height="8" fill="#FFF" fill-opacity="0.9" />
      <rect x="8" y="8" width="8" height="8" fill="#FFF" fill-opacity="0.9" />
      <rect x="8" y="0" width="8" height="8" fill="#B71C1C" fill-opacity="0.4" />
      <rect x="0" y="8" width="8" height="8" fill="#B71C1C" fill-opacity="0.4" />
    </pattern>
    <!-- Basket Weave -->
    <pattern id="weave" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#D7CCC8" />
      <path d="M 0 6 L 12 6 M 6 0 L 6 12" stroke="#BCAAA4" stroke-width="2" />
      <path d="M 0 12 L 12 12 M 12 0 L 12 12" stroke="#8D6E63" stroke-width="2" />
    </pattern>
  </defs>

  <!-- Shadow -->
  <ellipse cx="50" cy="90" rx="35" ry="8" fill="rgba(0,0,0,0.15)" />

  <!-- Back Handle -->
  <path d="M 22 50 C 22 -6 78 -6 78 50" fill="none" stroke="#795548" stroke-width="8" stroke-linecap="round" />
  <path d="M 22 50 C 22 -2 78 -2 78 50" fill="none" stroke="#A1887F" stroke-width="2" stroke-linecap="round" />

  <!-- Inside Cloth Base -->
  <path d="M 25 45 Q 50 15 75 45 Z" fill="url(#gingham)" />

  <!-- Basket Body Front -->
  <path d="M 15 45 L 25 85 Q 28 90 50 90 Q 72 90 75 85 L 85 45 Z" fill="url(#weave)" stroke="#5D4037" stroke-width="3" stroke-linejoin="round" />

  <!-- Horizontal banding to add classic wicker basket feel -->
  <path d="M 17 55 L 83 55 M 19 66 L 81 66 M 22 77 L 78 77" stroke="#8D6E63" stroke-width="5" stroke-linecap="round" />
  <path d="M 17 53 L 83 53 M 19 64 L 81 64 M 22 75 L 78 75" stroke="#F5F5F5" stroke-width="1.5" stroke-linecap="round" />

  <!-- Basket Rim Front -->
  <rect x="10" y="42" width="80" height="8" rx="4" fill="#8D6E63" stroke="#5D4037" stroke-width="3" />
  <rect x="12" y="43" width="76" height="2" rx="1" fill="#BCAAA4" />

  <!-- Picnic Cloth draping over the edge -->
  <path d="M 20 46 Q 30 30 55 46 Q 60 70 44 80 Q 25 85 10 70 Q 5 54 20 46 Z" fill="url(#gingham)" stroke="#B71C1C" stroke-width="2" stroke-linejoin="round"/>
  <!-- Fold shadow -->
  <path d="M 20 46 Q 30 30 55 46" fill="none" stroke="#B71C1C" stroke-width="2" stroke-linecap="round" />
</svg>